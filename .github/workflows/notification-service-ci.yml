# CI for Notification Service

name: notification-service-ci

on:
  push:
    branches:
      - main
      - develop

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: cloudmart/notification-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: services/notification-service
        run: npm install

      - name: Run lint
        working-directory: services/notification-service
        run: npm run lint --if-present

      - name: Run unit tests
        working-directory: services/notification-service
        run: npm test -- --passWithNoTests

      - name: Build application
        working-directory: services/notification-service
        run: npm run build

  validate-kubernetes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            ghcr.io/yannh/kubeconform:latest \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -kubernetes-version 1.32.0 \
            /workspace/k8s

  build-and-push:
    runs-on: ubuntu-latest
    needs:
      - lint-and-test
      - validate-kubernetes
    outputs:
      target_env: ${{ steps.set-env.outputs.target_env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Environment Target
        id: set-env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "target_env=production" >> $GITHUB_OUTPUT
          else
            echo "target_env=staging" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/notification-service
          file: services/notification-service/Dockerfile
          load: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Push Docker image to ECR
        run: docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

  # --- REGULAR DEPLOYMENT FOR STAGING ---
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.target_env == 'staging'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Manifest for Staging
        run: |
          sed -i "s|image: .*cloudmart/notification-service:.*|image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}|g" k8s/deployments/notification-service.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployments/notification-service.yaml
          git commit -m "chore(cd): deploy staging image tag ${{ env.IMAGE_TAG }} [skip ci]"
          git push origin develop

  # --- PROD DEPLOYMENT WITH MANUAL APPROVAL GATE ---
  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.target_env == 'production'
    environment: production # <--- This activates the GitHub manual approval gate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Manifest for Production
        run: |
          sed -i "s|image: .*cloudmart/notification-service:.*|image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}|g" k8s/deployments/notification-service.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployments/notification-service.yaml
          git commit -m "chore(cd): deploy prod image tag ${{ env.IMAGE_TAG }} [skip ci]"
          git push origin main

  # --- POST-DEPLOYMENT SMOKE TESTS ---
  smoke-test:
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    steps:
      - name: Determine Endpoint URL
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "APP_URL=http://prod.cloudmart.com/health" >> $GITHUB_ENV
          else
            echo "APP_URL=http://staging.cloudmart.com/health" >> $GITHUB_ENV
          fi

      - name: Wait for Argo CD Sync & Execute HTTP Smoke Test
        run: |
          echo "Waiting 60 seconds for Argo CD to sync and execute the rolling update..."
          sleep 60

          echo "Executing HTTP Readiness check against $APP_URL"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 $APP_URL)

          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "Success! Application health check returned HTTP 200."
          else
            echo "Failure! Application returned HTTP $STATUS_CODE. Reverting or alerting may be required."
            exit 1
          fi
