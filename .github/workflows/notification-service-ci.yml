# CI for Notification Service

name: notification-service-ci

on:
  push:
    branches:
      - main
      - develop

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: cloudmart/notification-service
  IMAGE_TAG: ${{ github.sha }}
  ECR_REGISTRY_URL: ${{ secrets.ECR_REGISTRY_URL }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: services/notification-service
        run: npm install

      - name: Run lint
        working-directory: services/notification-service
        run: npm run lint --if-present

      - name: Run unit tests
        working-directory: services/notification-service
        run: npm test -- --passWithNoTests

      - name: Build application
        working-directory: services/notification-service
        run: npm run build

  validate-kubernetes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            ghcr.io/yannh/kubeconform:latest \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -kubernetes-version 1.32.0 \
            /workspace/k8s

  build-and-push:
    runs-on: ubuntu-latest
    needs:
      - lint-and-test
      - validate-kubernetes
    outputs:
      target_env: ${{ steps.set-env.outputs.target_env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Environment Target
        id: set-env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "target_env=production" >> $GITHUB_OUTPUT
          else
            echo "target_env=staging" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/notification-service
          file: services/notification-service/Dockerfile
          load: true
          tags: |
            ${{ env.ECR_REGISTRY_URL }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY_URL }}/${{ env.ECR_REPOSITORY }}:latest
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY_URL }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Push Docker image to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY_URL }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY_URL }}/${{ env.ECR_REPOSITORY }}:latest

  update-gitops-manifest:
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update notification image tag (staging)
        if: github.ref_name == 'develop'
        run: |
          sed -i "s/newTag:.*/newTag: ${{ github.sha }}/" \
          k8s/deployments/overlays/staging/notification/kustomization.yaml

      - name: Update notification image tag (production)
        if: github.ref_name == 'main'
        run: |
          sed -i "s/newTag:.*/newTag: ${{ github.sha }}/" \
          k8s/deployments/overlays/prod/notification/kustomization.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          BRANCH=${{ github.ref_name }}

          git pull --rebase origin $BRANCH
          git add .
          git commit -m "chore(notification): update image tag to ${{ github.sha }}" || exit 0
          git push origin $BRANCH

  # --- PROD MANUAL APPROVAL GATE ---
  # If merging to main, this forces the workflow to pause until you approve.
  # Once approved, it successfully finishes, allowing the smoke-test to execute.
  production-gate:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.target_env == 'production'
    environment: production
    steps:
      - name: Approved
        run: echo "Production deployment approved. Handing over rollout to Argo CD Image Updater."
