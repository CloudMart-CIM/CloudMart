# CI for Notification Service

name: notification-ci

on:
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: "14"

            - name: Build application
              run: |
                  cd services/notification-service
                  npm install
                  npm run build

            - name: Run tests
              run: |
                  cd services/notification-service
                  npm test

    code-quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: "14"

            - name: Run ESLint
              run: |
                  cd services/notification-service
                  npm install
                  npm run lint

    docker:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Docker
              uses: docker/setup-buildx-action@v1

            - name: Login to Docker
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Docker Push
              uses: docker/build-push-action@v6
              with:
                  context: services/notification-service
                  file: services/notification-service/Dockerfile
                  push: true
                  tags: ${{ secrets.DOCKER_USERNAME }}/cloudmart-notification-service:${{github.run_id}}
